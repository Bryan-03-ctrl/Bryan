<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu Nombre | Enlaces y Contacto</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#38bdf8;--accent-rgb:56,189,248;--bg1:#02030f;--card:#0d1226;--text:#f1f5f9;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg1);color:var(--text);display:flex;justify-content:center;padding:28px 16px 48px;
 background-image:radial-gradient(circle at 0% 10%,rgba(var(--accent-rgb),.22),transparent 40%),radial-gradient(circle at 100% 100%,rgba(var(--accent-rgb),.18),transparent 45%);
 background-attachment:fixed;transition:background .4s}
#petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;border-radius:50% 0 50% 50%;opacity:.6;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}
main{position:relative;z-index:1;width:100%;max-width:300px}
.theme-title{text-align:center;font-size:9px;font-weight:700;margin-bottom:8px}
.themes{display:flex;justify-content:center;gap:12px;padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(13,18,38,.8)}
.themes button{width:24px;height:24px;border:0;border-radius:6px;font:700 10px 'Poppins';color:#fff;cursor:pointer;outline-offset:3px}
.themes button[aria-pressed="true"]{outline:2px solid #fff;transform:scale(1.2)}
.themes button:focus-visible{outline:2px solid #fff}
.card{margin-top:14px;padding:22px 20px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:var(--card);text-align:center}
.badge{display:inline-block;font-size:9px;font-weight:600;padding:3px 10px;border-radius:99px;color:var(--accent);background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.4)}
.avatar{width:90px;height:90px;margin:14px auto 10px;border-radius:50%;border:3px solid var(--accent);background:#1e293b center/cover;display:grid;place-items:center;font-size:34px;font-weight:700;box-shadow:0 0 22px rgba(var(--accent-rgb),.35)}
h1{font-size:20px;font-weight:700}
.bio{font-size:10.5px;font-weight:500;color:#cbd5e1;margin:6px 0 16px;line-height:1.5}
.links{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px}
.link{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:#fff;text-decoration:none;text-align:left;border:1px solid rgba(255,255,255,.12);transition:transform .15s,filter .15s}
.link:hover{transform:translateY(-2px);filter:brightness(1.12)}
.link:focus-visible{outline:2px solid #fff;outline-offset:2px}
.icon{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none}
.icon svg{width:16px;height:16px;fill:#fff}
.txt{flex:1;line-height:1.25}
.txt b{display:block;font-size:10.5px;font-weight:700}
.txt small{font-size:8px;opacity:.75}
.chev{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2;opacity:.7}
.whatsapp{background:#0f8a63}
.phone{background:#1d4ed8}
.tiktok{background:#0d1226}
.instagram{background:linear-gradient(90deg,#7e22ce,#be185d 55%,#d97706)}
.facebook{background:#1e40af}
.copy{width:46px;flex:none;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0d1226;color:#fff;cursor:pointer;display:grid;place-items:center}
.copy:hover{background:#1a2142}
.copy svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--accent);color:#04101c;font-size:11px;font-weight:700;padding:8px 16px;border-radius:99px;opacity:0;transition:.25s;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{margin-top:16px;font-size:9px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.petal{animation:none}.link{transition:none}}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>
<main>
  <p class="theme-title" id="themeTitle"></p>
  <div class="themes" id="themes" role="group" aria-label="Elegir tema"></div>

  <section class="card">
    <span class="badge" id="badge"></span>
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>
    <div class="links" id="links"></div>
    <footer id="footer"></footer>
  </section>
</main>
<div id="toast" role="status"></div>

// Pétalos
const petals = document.getElementById("petals");
let petalTimer;
function crearPetalos(color){
  petals.innerHTML="";
  for(let i=0;i<22;i++){
    const p=document.createElement("span");
    const s=4+Math.random()*7;
    p.className="petal";
    p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${color};animation-duration:${9+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;
    petals.appendChild(p);
  }
}

const cont = document.getElementById("themes");

  const b=document.createElement("button");
  b.textContent=t.kanji; b.style.background=t.color; b.setAttribute("aria-label","Tema "+(i+1));
  b.addEventListener("click",()=>aplicar(i));
  cont.appendChild(b);
});
function aplicar(i){
  const t=TEMAS[i], r=document.documentElement.style;
  r.setProperty("--accent",t.color); r.setProperty("--accent-rgb",t.rgb);
  document.getElementById("badge").textContent=t.badge;
  [...cont.children].forEach((b,j)=>b.setAttribute("aria-pressed",j===i));
  crearPetalos(t.color);
  try{localStorage.setItem("tema",i)}catch{}
}
