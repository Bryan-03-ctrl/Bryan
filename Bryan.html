
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bryan Núñez | Enlaces & Contacto</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 15px;
    font-family: "Segoe UI", Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 5% 10%, #153c30, transparent 30%),
        radial-gradient(circle at 95% 90%, #3a151b, transparent 30%),
        #050615;
}

.tema {
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 12px;
    text-align: center;
    color: #ff8585;
}

.selector {
    display: flex;
    justify-content: center;
    gap: 12px;
    width: 298px;
    padding: 12px;
    margin-bottom: 13px;
    border: 1px solid #30364a;
    border-radius: 13px;
    background: #0e1424;
}

.selector button {
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    color: white;
}

.selector button.activo {
    outline: 2px solid white;
    outline-offset: 3px;
}

.rojo { background: #e52942; }
.verde { background: #18a878; }
.azul { background: #168fd0; }
.morado { background: #9c4de2; }
.amarillo { background: #f5b927; color: #222 !important; }

.tarjeta {
    width: 100%;
    max-width: 298px;
    padding: 22px 21px;
    text-align: center;
    border: 1px solid #30394b;
    border-radius: 17px;
    background: rgba(14, 20, 36, 0.97);
    box-shadow: 0 15px 45px #0005;
}

.etiqueta {
    display: inline-block;
    padding: 5px 10px;
    margin-bottom: 12px;
    color: #ff9a9a;
    background: #401c29;
    border: 1px solid #77303c;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
}

.foto-marco {
    width: 100px;
    height: 100px;
    padding: 3px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff354b, #ffb44c);
    box-shadow: 0 0 18px #ff354b35;
}

.foto {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    border: 2px solid #101626;
    border-radius: 50%;
}

h1 {
    font-size: 22px;
    margin-bottom: 5px;
}

.descripcion {
    color: #b8c1d2;
    font-size: 10px;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 18px;
}

.enlaces {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.enlace {
    min-height: 49px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    color: white;
    text-align: left;
    text-decoration: none;
    border: 1px solid #ffffff12;
    border-radius: 12px;
    transition: transform .2s, filter .2s;
}

.enlace:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
}

.icono {
    width: 30px;
    height: 30px;
    display: flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    background: #ffffff19;
    font-size: 17px;
    font-weight: bold;
}

.info {
    flex: 1;
}

.nombre {
    display: block;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 3px;
}

.detalle {
    display: block;
    font-size: 9px;
    opacity: .8;
    overflow-wrap: anywhere;
}

.flecha {
    font-size: 20px;
}

.tiktok { background: #161b27; }
.instagram {
    background: linear-gradient(110deg, #8134af, #dd2a7b, #f58529);
}
.facebook { background: #2051b8; }

.pie {
    color: #798399;
    font-size: 9px;
    margin-top: 18px;
}

.pie span {
    color: #ff7272;
}

@media (max-width: 350px) {
    .tarjeta {
        padding: 20px 15px;
    }

    .selector {
        gap: 10px;
    }
}
</style>
</head>

<body>

<div class="tema">
    🍎 TEMA: MICHAEL MANZANITA
</div>

<nav class="selector">
    <button class="rojo activo" data-color="#e52942">一</button>
    <button class="verde" data-color="#18a878">二</button>
    <button class="azul" data-color="#168fd0">三</button>
    <button class="morado" data-color="#9c4de2">四</button>
    <button class="amarillo" data-color="#f5b927">五</button>
</nav>

<main class="tarjeta">

    <div class="etiqueta">
        🍎 Michael Manzanita
    </div>

    <div class="foto-marco">
        <img
            class="foto"
            src="image(1).png"
            alt="Foto de perfil de Bryan Núñez"
        >
    </div>

    <h1>Bryan Núñez</h1>

    <p class="descripcion">
        ¡Bienvenido a mi perfil! 🍎<br>
        Sígueme en mis redes sociales.
    </p>

    <section class="enlaces">

        <a class="enlace tiktok"
           href="https://www.tiktok.com/@bryanxd137"
           target="_blank" rel="noopener noreferrer">
            <span class="icono">♪</span>
            <span class="info">
                <span class="nombre">TikTok</span>
                <span class="detalle">@bryanxd137</span>
            </span>
            <span class="flecha">›</span>
        </a>

        <a class="enlace instagram"
           href="https://instagram.com/bryannunez85?rpxt=NjY1bWZjZWZqYjhm"
           target="_blank" rel="noopener noreferrer">
            <span class="icono">◎</span>
            <span class="info">
                <span class="nombre">Instagram</span>
                <span class="detalle">@bryannunez85</span>
            </span>
            <span class="flecha">›</span>
        </a>

        <a class="enlace facebook"
           href="https://www.facebook.com/share/19A7BFsgLt/?mibextid=wwXIfr"
           target="_blank" rel="noopener noreferrer">
            <span class="icono">f</span>
            <span class="info">
                <span class="nombre">Facebook</span>
                <span class="detalle">Mi perfil oficial</span>
            </span>
            <span class="flecha">›</span>
        </a>

    </section>

    <div class="pie">
        Hecho con <span>♥</span> por Bryan
    </div>

</main>

<script>
// Cambiar el color del borde de la foto
const botones = document.querySelectorAll(".selector button");
const marco = document.querySelector(".foto-marco");

botones.forEach(boton => {
    boton.addEventListener("click", () => {
        botones.forEach(b => b.classList.remove("activo"));
        boton.classList.add("activo");

        const color = boton.dataset.color;

        marco.style.background =
            `linear-gradient(135deg, ${color}, #ffb44c)`;
    });
});
</script>

</body>
</html>
